<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minimal TD · Davet</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icon.png">
<style>
  :root { --bg:#F6F1E7; --card:#FFFDF8; --ink:#4A4458; --muted:#857E8E; --good:#7CC4A0; --good-ink:#2F6B4F; --line:#E4DCCB; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:440px; margin:0 auto; padding:28px 16px 40px; }
  .head { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .head img { width:72px; height:72px; border-radius:18px; box-shadow:0 2px 0 var(--line); }
  h1 { font-size:28px; margin:0; letter-spacing:.5px; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:18px; padding:18px; margin:14px 0; }
  .who { font-size:19px; font-weight:700; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:14px; margin:0; }
  .step { display:flex; gap:10px; align-items:baseline; font-weight:700; margin:0 0 10px; }
  .num { flex:none; width:26px; height:26px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; font-size:14px; }
  a.btn, button.btn { display:block; width:100%; text-align:center; text-decoration:none; border:0; border-radius:14px;
    padding:15px 12px; font:inherit; font-weight:700; font-size:17px; cursor:pointer; color:var(--ink); background:#EDE6D8; }
  .btn.good { background:var(--good); color:#fff; }
  .code { display:flex; gap:8px; align-items:center; background:#F1EBDF; border-radius:12px; padding:10px 12px; margin-top:10px; }
  .code b { flex:1; word-break:break-all; }
  .code button { border:0; background:none; color:#5A93BF; font:inherit; font-weight:700; cursor:pointer; }
  .note { font-size:13px; color:var(--muted); margin-top:10px; }
</style>
</head>
<body>
<main>
  <div class="head"><img src="icon.png" alt=""><h1>minimal TD</h1></div>

  <div class="card">
    <p class="who" id="who"></p>
    <p class="muted" id="gift"></p>
  </div>

  <div class="card">
    <p class="step"><span class="num">1</span><span id="s1"></span></p>
    <a class="btn good" id="download" href="#"></a>
    <p class="note" id="n1"></p>
  </div>

  <div class="card">
    <p class="step"><span class="num">2</span><span id="s2"></span></p>
    <a class="btn" id="open" href="#"></a>
    <div class="code"><span id="codeLabel"></span><b id="code"></b><button id="copy"></button></div>
    <p class="note" id="n2"></p>
  </div>
</main>
<script>
(function () {
  var TR = {
    who: function (n) { return n ? n + " seni minimal TD'ye davet etti!" : "minimal TD'ye davetlisin!"; },
    gift: "Daveti kabul edince otomatik arkadaş olursunuz ve ikiniz de elmas kazanırsınız.",
    s1: "Oyunu indir ve kur (Android)", download: "Oyunu indir",
    n1: "İndirme bitince dosyayı aç; telefon sorarsa bu kaynaktan kuruluma izin ver.",
    s2: "Oyunu aç, davet kendiliğinden kabul edilsin", open: "Oyunu aç ve daveti kabul et",
    codeLabel: "Davet kodu:", copy: "Kopyala", copied: "Kopyalandı",
    n2: "Kurulumdan sonra bu sayfaya dönüp butona bas. Olmazsa oyunda Elmas → \"Davet kodun var mı?\" kısmına kodu yaz."
  };
  var EN = {
    who: function (n) { return n ? n + " invited you to minimal TD!" : "You're invited to minimal TD!"; },
    gift: "Accept the invite to become friends automatically; you both get diamonds.",
    s1: "Download and install the game (Android)", download: "Download the game",
    n1: "When the download finishes, open the file; allow installs from this source if asked.",
    s2: "Open the game; the invite is accepted automatically", open: "Open the game and accept",
    codeLabel: "Invite code:", copy: "Copy", copied: "Copied",
    n2: "After installing, come back to this page and tap the button. If that doesn't work, enter the code in the game under Diamonds → \"Have an invite code?\"."
  };
  var t = (navigator.language || "tr").toLowerCase().indexOf("tr") === 0 ? TR : EN;
  document.documentElement.lang = t === TR ? "tr" : "en";
  var params = new URLSearchParams(location.search);
  var code = (params.get("d") || "").trim();
  var name = code.indexOf("#") > 0 ? code.split("#")[0].replace(/_/g, " ") : "";
  var $ = function (id) { return document.getElementById(id); };
  $("who").textContent = t.who(name);
  $("gift").textContent = t.gift;
  ["s1", "n1", "s2", "n2", "codeLabel"].forEach(function (k) { $(k).textContent = t[k]; });
  $("download").textContent = t.download;
  $("open").textContent = t.open;
  $("copy").textContent = t.copy;
  $("code").textContent = code || "—";

  var TAG = "MTD-DAVET:";
  function remember() {
    if (!code || !navigator.clipboard) return Promise.resolve();
    return navigator.clipboard.writeText(TAG + code).catch(function () {});
  }
  var apk = "#";
  fetch("apk.json", { cache: "no-store" }).then(function (r) { return r.json(); })
    .then(function (j) { apk = j.url; $("download").href = apk; }).catch(function () {});
  $("download").addEventListener("click", function (e) {
    e.preventDefault();
    remember().then(function () { if (apk !== "#") location.href = apk; });
  });

  var q = "kod=" + encodeURIComponent(code);
  var android = /android/i.test(navigator.userAgent);
  $("open").href = android
    ? "intent://davet?" + q + "#Intent;scheme=minimaltd;package=com.pastel.towerdefence;end"
    : "minimaltd://davet?" + q;
  $("open").addEventListener("click", function () { remember(); });
  $("copy").addEventListener("click", function () {
    if (!code || !navigator.clipboard) return;
    navigator.clipboard.writeText(code).then(function () { $("copy").textContent = t.copied; });
  });
})();
</script>
</body>
</html>
